[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retaining-wall-analysis"
version = "0.1.0"
description = "Traceable retaining wall stability analysis with a Traditional Chinese local web UI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
retaining-wall = "retaining_wall.server:main"

[tool.setuptools]
packages = ["retaining_wall"]

[tool.setuptools.package-data]
retaining_wall = ["web/*"]

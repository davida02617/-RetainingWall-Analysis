<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擋土牆分析檢核</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><span class="eyebrow">RETAINING WALL · ENGINEERING WORKSPACE</span><h1>擋土牆分析檢核</h1><p>懸臂式與重力式 · 常時與地震 · 可追溯的計算明細</p></div><span class="version">V0.1 開發版</span></header>
<div class="notice">乾土限定分析。RC、沉陷與整體穩定尚未檢核；所有預設參數為示範。承載力須輸入地質依據。</div>
<nav id="tabs" aria-label="斷面切換"></nav><section class="toolbar"><input id="project" aria-label="計畫名稱" placeholder="計畫名稱（計算書用）"><button id="add">＋新增斷面</button><button id="save">保存專案</button><button id="export">匯出 JSON</button><label class="button">匯入 JSON<input id="import" type="file" accept="application/json,.json" hidden></label><button id="copy">複製摘要</button><button id="print">列印／PDF</button></section>
<p id="message" role="status"></p><div class="layout"><section class="inputs"><form id="form"></form></section><section class="output"><article class="card drawing"><div class="cardhead"><h2>斷面預覽</h2><span>每延米 · m / kN / kPa</span></div><svg id="section" viewBox="0 0 600 400" role="img" aria-label="擋土牆斷面"></svg><p id="geometry"></p></article><article class="card"><h2>穩定檢核</h2><div id="results" aria-live="polite">等待計算…</div></article><article class="card"><h2>計算明細與依據</h2><div id="details"></div></article></section></div><footer>Python 計算核心 · 本機保存 · <a href="https://law.moa.gov.tw/LawContent.aspx?id=FL014521" target="_blank" rel="noopener">水土保持技術規範第 120 條</a></footer></main><script src="app.js"></script></body></html>
